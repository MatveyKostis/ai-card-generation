[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui = "0.2.2"
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

# xattr 0.2.3 references libc::ENOATTR (removed in newer libc); local patched
# copy maps it to ENODATA, its Linux equivalent.
# gpui 0.2.2: DirectWrite GPUState::new treats emoji-shader creation failure as
# fatal during platform init ("Error creating DirectWriteTextSystem"); the
# patched copy degrades to monochrome-only emoji rendering instead (see
# vendor-local/gpui-src/README-cardgen.md).
[patch.crates-io]
xattr = { path = "vendor-local/xattr-src" }
gpui = { path = "vendor-local/gpui-src" }
